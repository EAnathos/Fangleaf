<!doctype html>
<!--
  Image d'aperçu des liens partagés (client/public/og.jpg, 1200×630) : la scène du lobby et le titre.
  Page de dev seulement (absente du build). Pour la refaire : npm run dev, puis
  firefox --headless --window-size=1200,630 --screenshot og.png http://localhost:5173/og.html
  magick og.png -quality 88 client/public/og.jpg
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fangleaf · aperçu</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Outfit:wght@500;600&display=block" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #10181A; }
    #lobby-scene { position: fixed; inset: 0; width: 100%; height: 100%; }
    header { position: relative; padding-top: 62px; text-align: center; font-family: 'Outfit', sans-serif; }
    h1 { margin: 0; font: 700 112px/1 'Pixelify Sans', sans-serif; color: #F0B64A; letter-spacing: 2px; text-shadow: 0 6px 0 #5B3F2C; }
    p { margin: 18px 0 0; font-size: 34px; font-weight: 600; color: #EEE7D7; }
    p + p { margin-top: 12px; font-size: 21px; color: #C9CFC2; }
  </style>
</head>
<body>
  <canvas id="lobby-scene" aria-hidden="true"></canvas>
  <header>
    <h1>Fangleaf</h1>
    <p>Chasse, apprivoise, mène ta meute.</p>
    <p>Jeu coop jusqu’à 4, dans ton navigateur</p>
  </header>
  <script type="module">
    import { startLobbyScene } from './src/lobbyScene.ts';
    startLobbyScene(document.getElementById('lobby-scene'), () => true);
  </script>
</body>
</html>
