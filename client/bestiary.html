<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fangleaf — Bestiaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --night: #10181A; --panel: #1B2624; --line: #34463F; --text: #EEE7D7; --text-2: #C9CFC2; --muted: #A9B3A6; --amber: #F0B64A; --alpha: #B48CFF; --enemy: #E8693F; --ally: #5CC8B8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--night); color: var(--text); font-family: 'Outfit', system-ui, sans-serif; }
    main { max-width: 1200px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; gap: 36px; }
    h1 { margin: 0; font: 700 44px 'Pixelify Sans', sans-serif; color: var(--amber); }
    h2 { margin: 0 0 4px; font: 700 26px 'Pixelify Sans', sans-serif; }
    .lead { margin: 6px 0 0; color: var(--text-2); max-width: 720px; line-height: 1.5; }
    .sub { margin: 0 0 16px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 16px; }
    .card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .card canvas { width: 100%; height: 230px; display: block; background: radial-gradient(ellipse at 50% 80%, #2C4A33 0%, #1D3326 60%, #16261E 100%); }
    .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
    .title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .title b { font: 700 20px 'Pixelify Sans', sans-serif; }
    .tag { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: rgba(240, 182, 74, 0.14); color: var(--amber); white-space: nowrap; }
    .stats { font-size: 14px; color: var(--text-2); }
    .desc { font-size: 14px; color: var(--muted); line-height: 1.45; }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .legend span::before { content: ''; display: inline-block; width: 12px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: middle; background: var(--c); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Bestiaire</h1>
      <p class="lead">Toutes les espèces du jeu, par zone, dessinées avec le moteur du jeu : sauvage, apprivoisée, puis en Alpha.</p>
    </header>
    <div class="legend"><span style="--c: var(--enemy)">anneau braise : sauvage</span><span style="--c: var(--ally)">anneau couleur du joueur : apprivoisé</span><span style="--c: var(--alpha)">aura et couronne : Alpha</span></div>

    <section>
      <div class="grid" id="all"></div>
    </section>
  </main>
  <script type="module" src="/src/bestiary.ts"></script>
</body>
</html>
