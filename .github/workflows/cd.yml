# Redéploiement sur le VPS : quand la CI passe sur main (ou à la main depuis l'onglet Actions).
#
# Secrets du dépôt (Settings › Secrets and variables › Actions) :
#   VPS_HOST     IP ou nom du VPS
#   VPS_USER     utilisateur SSH (root)
#   VPS_SSH_KEY  clé privée d'une paire dédiée au déploiement (sa clé publique dans ~/.ssh/authorized_keys du VPS)
#   VPS_PORT     facultatif, 22 par défaut
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false # un déploiement en cours va toujours au bout

jobs:
  deploy:
    name: Déploiement sur fangleaf.anathos.me
    # Après la CI : seulement si elle a réussi, sur un push (pas une PR venue d'un fork).
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://fangleaf.anathos.me
    steps:
      - name: Clé SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Mise à jour du serveur
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd ~/eanathos/Fangleaf && git fetch -q origin main && git checkout -q main && git merge -q --ff-only $SHA && bash deploy/deploy.sh"

      - name: Le site répond
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://fangleaf.anathos.me/ | grep -q '<title>Fangleaf</title>'; then echo "En ligne"; exit 0; fi
            sleep 3
          done
          echo "fangleaf.anathos.me ne répond pas" >&2
          exit 1
