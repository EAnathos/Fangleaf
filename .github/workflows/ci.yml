# Contrôles qualité : à chaque push et pull request.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, règles, fumée, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Une promotion qui contient encore des fragments .changes/ part en production sans sa version : la Release
      # ne pourrait pas être publiée. Fusionner d'abord la PR de version (release-version.yml).
      - name: 'Promotion : nouveautés toutes versionnées'
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev'
        run: |
          restants=$(find .changes -maxdepth 1 -name '*.json' | sort)
          if [ -n "$restants" ]; then
            echo "::error title=Version manquante::Fragments pas encore versionnés, fusionner d'abord la PR de version (automation/version-changelog) :"
            echo "$restants"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # même version majeure que le VPS
          cache: npm

      - run: npm ci

      - name: Valider les fichiers de changements
        run: npm run changesets:check

      - name: TypeScript
        run: npm run typecheck

      - name: Règles de simulation
        run: npm run test:rules

      - name: Géants et attaques sur plusieurs terrains
        run: npm run test:rules -- geants attaques --seeds=42,777

      - name: Test de fumée (serveur + clients WebSocket)
        run: npm run smoke

      - name: Build du client
        run: npm run build
