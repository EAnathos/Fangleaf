name: Version and changelog

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-version-dev
  cancel-in-progress: false

jobs:
  version:
    name: Prepare version and changelog PR
    runs-on: ubuntu-latest
    timeout-minutes: 30 # CI de la PR de version comprise
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate changesets
        run: npm run changesets:check
      - name: Generate release version and changelog
        run: npm run release:version
      - name: Commit release metadata on automation branch
        id: commit
        env:
          BRANCH: automation/version-changelog
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json client/src/changelog.json .changes
          git commit -m "Versionne la publication et consolide le changelog"
          # Cette branche est réservée au bot : elle est reconstruite depuis dev
          # à chaque exécution pour intégrer les derniers changements sans toucher à dev.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create or update version pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/version-changelog
        run: |
          title="chore(release): publier la version et le changelog"
          body="$(cat <<'EOF'
          Cette PR est générée automatiquement à partir des fichiers `.changes`.

          Elle met à jour la version du projet et le changelog consolidé. Elle passe par les contrôles habituels de `dev` : aucune protection de branche n'est contournée.

          Closes #49
          EOF
          )"
          number="$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base dev --head "$BRANCH" --title "$title" --body "$body"
          fi
      # Les pushes et créations de PR effectués avec GITHUB_TOKEN ne déclenchent
      # pas automatiquement les workflows CI : on lance donc la CI explicitement.
      - name: Run CI on the version PR branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/version-changelog
        run: gh workflow run ci.yml --ref "$BRANCH"

      # La PR de version n'a aucune décision à porter : elle se fusionne seule dès que sa CI passe, pour que la
      # version ne reste jamais en attente (une promotion sans elle ne pourrait pas publier sa Release).
      # Une fusion faite avec GITHUB_TOKEN ne déclenche aucun workflow : la CI de dev, et donc le déploiement du
      # staging, est relancée explicitement (cd-staging.yml accepte une CI lancée par workflow_dispatch).
      - name: Merge the version PR once its CI passes
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/version-changelog
        run: |
          sha=$(git rev-parse HEAD)
          run=
          for i in $(seq 1 24); do # la CI demandée met quelques secondes à apparaître
            run=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --commit "$sha" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 5
          done
          [ -n "$run" ] || { echo "::error::CI introuvable pour ${sha:0:7} : PR de version laissée ouverte"; exit 1; }
          if ! gh run watch "$run" --exit-status --interval 20 >/dev/null; then
            echo "::error::CI en échec sur la PR de version : elle reste ouverte, à corriger par une PR vers dev"
            exit 1
          fi
          number=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')
          [ -n "$number" ] || { echo "PR de version déjà fusionnée ou fermée"; exit 0; }
          # --match-head-commit : on ne fusionne que le commit que la CI vient de valider.
          gh pr merge "$number" --merge --match-head-commit "$sha"
          gh workflow run ci.yml --ref dev
