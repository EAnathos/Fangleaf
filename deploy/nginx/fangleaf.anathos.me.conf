# Fangleaf · nginx pour fangleaf.anathos.me
# Le serveur Node (npm start, port 3001) sert le build statique (dist/) et le WebSocket /ws :
# nginx ne fait que le HTTPS et le relais.
#
# Installation (le certificat d'abord : sans lui, nginx -t refuse le bloc 443) :
#   sudo certbot certonly --nginx -d fangleaf.anathos.me
#   sudo cp deploy/nginx/fangleaf.anathos.me.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/fangleaf.anathos.me.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Upgrade WebSocket seulement quand le client le demande.
map $http_upgrade $fangleaf_connection {
    default upgrade;
    ''      close;
}

upstream fangleaf {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name fangleaf.anathos.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2; # « http2 on; » à la place à partir de nginx 1.25
    listen [::]:443 ssl http2;
    server_name fangleaf.anathos.me;

    ssl_certificate     /etc/letsencrypt/live/fangleaf.anathos.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fangleaf.anathos.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fangleaf_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Partie de jeu : WebSocket longue durée.
    location /ws {
        proxy_pass http://fangleaf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fangleaf_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Fichiers du build Vite : noms hachés, cache long.
    location /assets/ {
        proxy_pass http://fangleaf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        # un add_header ici masque ceux du bloc server : on les répète
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Pages (index.html, bestiary.html) : Node n'envoie ni ETag ni Last-Modified, le navigateur les redemande.
    location / {
        proxy_pass http://fangleaf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
